<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualización de Respuestas - UMSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #tablaDatos th { white-space: nowrap; font-size: .85rem; }
        #tablaDatos td { font-size: .85rem; }
        .celda { max-width: 220px; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container" style="max-width: 1400px;">
            <a class="navbar-brand fw-bold" href="/index.html">UMSS Encuestas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link fw-semibold" href="/index.html">Responder Encuesta</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="/dashboard.html">Dashboard / Reportes</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="/previsualizacion.html">Respuestas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-2" style="max-width: 1400px;">
        <h2 class="text-primary fw-bold mb-1">Previsualización de Respuestas</h2>
        <p class="text-muted">Datos recibidos de cada encuesta, un envío por fila.</p>

        <div class="card shadow-sm mb-4">
            <div class="card-body row g-3 align-items-end">
                <div class="col-md-8">
                    <label class="form-label fw-bold">Encuesta</label>
                    <select id="selectEncuesta" class="form-select">
                        <option value="">Cargando encuestas...</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Filas por página</label>
                    <select id="selectTamanio" class="form-select">
                        <option>10</option><option selected>20</option><option>50</option><option>100</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="panelDatos" class="card shadow-sm d-none">
            <div class="card-body">
                <div class="table-responsive">
                    <table id="tablaDatos" class="table table-bordered table-hover table-sm align-middle mb-0">
                        <thead class="table-light"></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <span id="resumenPaginacion" class="text-muted small"></span>
                    <div class="btn-group">
                        <button id="btnAnterior" class="btn btn-outline-primary btn-sm">Anterior</button>
                        <button id="btnSiguiente" class="btn btn-outline-primary btn-sm">Siguiente</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalDetalle" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-primary">Detalle del envío</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="cuerpoDetalle"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/previsualizacion.js"></script>
</body>
</html>
