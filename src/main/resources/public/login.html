<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - UMSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="/img/umss.png" alt="Logo UMSS" height="48" class="mb-2">
                <h4 class="fw-bold text-primary">Acceso Administrativo</h4>
                <p class="text-muted small">Ingrese sus credenciales para ver Reportes y Respuestas</p>
            </div>
            
            <div id="alertaError" class="alert alert-danger d-none py-2 small"></div>

            <form id="formLogin" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario</label>
                    <input type="text" id="usuario" class="form-control" placeholder="Ingrese su usuario" maxlength="30" autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña" maxlength="30">
                </div>
                <button type="submit" id="btnIngresar" class="btn btn-primary w-100 fw-bold">Ingresar</button>
                <a href="/index.html" class="btn btn-link w-100 mt-2 text-decoration-none small">Volver a Encuestas</a>
            </form>
        </div>
    </div>

    <script>
        const inputUsuario = document.getElementById('usuario');
        const inputPassword = document.getElementById('password');
        const alerta = document.getElementById('alertaError');
        const btn = document.getElementById('btnIngresar');

        // Oculta el mensaje de error apenas el usuario vuelve a escribir
        [inputUsuario, inputPassword].forEach(input => {
            input.addEventListener('input', () => {
                alerta.classList.add('d-none');
            });
        });

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usuario = inputUsuario.value.trim();
            const password = inputPassword.value.trim();

            // 1. Validar que los campos no estén vacíos
            if (!usuario || !password) {
                alerta.textContent = 'Por favor, ingrese sus datos (usuario y contraseña).';
                alerta.classList.remove('d-none');
                if (!usuario) inputUsuario.focus();
                else inputPassword.focus();
                return;
            }

            // 2. Indicar visualmente que se está verificando
            alerta.classList.add('d-none');
            btn.disabled = true;
            btn.textContent = 'Verificando...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                if (res.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    alerta.textContent = 'Usuario o contraseña incorrectos.';
                    alerta.classList.remove('d-none');
                }
            } catch (err) {
                alerta.textContent = 'Error de conexión con el servidor.';
                alerta.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ingresar';
            }
        });
    </script>
</body>
</html>
